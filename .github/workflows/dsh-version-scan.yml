name: dsh version scan

# 每日扫描官方 dsh 的 npm `latest` dist-tag（稳定线）。不跟 npm `next` 或
# GitHub harness 预发布。发现比当前 dsh.compatibility.tested 更新的 latest
# 时：自动升级依赖与基线、跑完整 check、在隔离 DSH_HOME 下对新版 stock dsh
# 重跑插拔契约，全部通过后开一个升级 PR。任何一步失败则不产生 PR。

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Check the npm latest dsh against the tested baseline
        id: check
        run: |
          RESULT=$(node scripts/bump-dsh.mjs --check)
          echo "$RESULT"
          echo "target=$(echo "$RESULT" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).target')" >> "$GITHUB_OUTPUT"
          echo "update=$(echo "$RESULT" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).updateAvailable')" >> "$GITHUB_OUTPUT"

      - name: Skip when an upgrade branch or PR already exists
        id: guard
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="auto/dsh-${{ steps.check.outputs.target }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump to the npm latest dsh
        id: bump
        if: steps.check.outputs.update == 'true' && steps.guard.outputs.exists == 'false'
        run: |
          # 经 dsh-scan-guard 降噪：待迁移集合无变化时静默 exit 0（proceed=false），
          # 不再每天为同一已知状态红一次；集合变化时才 exit 2 并更新状态文件。
          node scripts/dsh-scan-guard.mjs "${{ steps.check.outputs.target }}"

      - name: Typecheck, test, build, and pack dry-run
        if: steps.check.outputs.update == 'true' && steps.guard.outputs.exists == 'false' && steps.bump.outputs.proceed == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run check

      - name: Stock dsh add/boot/remove/re-add contract under an isolated DSH_HOME
        if: steps.check.outputs.update == 'true' && steps.guard.outputs.exists == 'false' && steps.bump.outputs.proceed == 'true'
        run: |
          node scripts/install-stock-dsh.mjs "$RUNNER_TEMP/dsh-global"
          TARBALL=$(pnpm pack | tail -1)
          DSH_BIN="$RUNNER_TEMP/dsh-global/node_modules/.bin/dsh" \
          SEEKTTY_SPEC="$PWD/$TARBALL" \
            node scripts/stock-dsh-cycle.mjs
          rm -f "$TARBALL"

      - name: Open the upgrade pull request
        if: steps.check.outputs.update == 'true' && steps.guard.outputs.exists == 'false' && steps.bump.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ steps.check.outputs.target }}"
          BRANCH="${{ steps.guard.outputs.branch }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml src/dsh-compat.ts src/pnpm-compat.ts lib/ README.md README.zh.md
          git commit -m "chore(compat): adapt to official dsh $TARGET"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore(compat): adapt to official dsh $TARGET" \
            --body "$(printf '自动扫描发现官方 dsh 稳定版 %s（npm latest）。\n\n- 全部 @deepseek-ai/dsh-* 依赖与 dsh.compatibility.tested 升级到 %s\n- pnpm run check 通过\n- 隔离 DSH_HOME 下对 stock dsh %s 的 add/boot/remove/re-add 插拔契约通过\n\n合并前请人工确认 README 兼容性描述与 CHANGELOG。' "$TARGET" "$TARGET" "$TARGET")"

      # 降噪状态文件回写：只有待迁移集合发生变化时守卫才会改这个文件；
      # 此时 bump 步骤是红的（为的是发通知），用 always() 把新状态提交回去，
      # 下次同样集合就不再红。无变化时直接退出。
      - name: Commit scan state if changed
        if: always()
        run: |
          if git diff --quiet .dsh-scan-state.json; then echo "No scan state change"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .dsh-scan-state.json
          git commit -m "chore(scan): 更新 dsh 待迁移集合状态"
          for i in 1 2 3; do
            if git fetch origin "${{ github.ref_name }}" && git merge --no-edit "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            git merge --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::scan state 推不上去，已重试 3 次。"
          exit 1
